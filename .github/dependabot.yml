version: 2
updates:
  # `uv`, not `pip`: the pip ecosystem edits pyproject.toml without regenerating
  # uv.lock, which makes `uv lock --check` (and every `uv sync --locked` job after
  # it) fail on each dependency PR. The uv ecosystem moves both files together.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      security:
        applies-to: security-updates
        patterns:
          - "*"
      major:
        update-types:
          - major
      patch-and-minor:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      security:
        applies-to: security-updates
        patterns:
          - "*"
      major:
        update-types:
          - major
      patch-and-minor:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      security:
        applies-to: security-updates
        patterns:
          - "*"
      major:
        update-types:
          - major
      patch-and-minor:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
